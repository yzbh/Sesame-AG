name: Release Build
run-name: Release Build - ${{ github.ref_name }}

on:
  push:
    tags:
      - "[0-9]*.*"
  workflow_dispatch:

env:
  CI: "true"
  JAVA_DISTRIBUTION: "oracle"
  JAVA_VERSION: "17.0.1"
  ANDROID_API_LEVEL: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  LOCAL_GRADLE_VERSION: "9.4.0-milestone-3"
  LOCAL_AGP_VERSION: "9.0.1"
  LOCAL_KOTLIN_VERSION: "2.2.10"
  RELEASE_DIR: app/build/outputs/apk/release
  STAGING_DIR: app/build/outputs/apk/all
  ASSET_DIR: app/build/outputs/apk/release-assets
  RELEASE_TAG_RAW: ${{ github.ref_name }}
  
  # --- 重要配置区 (根据分支修改这里) ---
  # 如果是 main 分支，设置为: main
  # 如果是 dev 分支，设置为: dev
  TARGET_SOURCE_BRANCH: main 
  
  # 如果是 main 分支，通常设为: "true"
  # 如果是 dev 分支，通常设为: "false" (不自动发布)
  PUBLISH_TO_XPOSED_REPO: "true"
  # ----------------------------------
  
  TARGET_MODULE_REPO: Xposed-Modules-Repo/io.github.aoguai.sesameag

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      reason: ${{ steps.check.outputs.reason }}
      tag_valid: ${{ steps.meta.outputs.tag_valid }}
      tag_version_code: ${{ steps.meta.outputs.tag_version_code }}
      configured_version_name: ${{ steps.meta.outputs.configured_version_name }}
      version_name: ${{ steps.meta.outputs.version_name }}
      version_code: ${{ steps.meta.outputs.version_code }}
      xposed_tag: ${{ steps.meta.outputs.xposed_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Resolve Release Metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          release_tag_regex='^([0-9]+)-(.+)$'
          tag_valid="false"
          tag_version_code=""
          version_name=""
          if [[ "${RELEASE_TAG_RAW}" =~ ${release_tag_regex} ]]; then
            tag_valid="true"
            tag_version_code="${BASH_REMATCH[1]}"
            version_name="${BASH_REMATCH[2]}"
          fi
          configured_version_name="$(sed -n 's/^appVersion=//p' gradle.properties | head -n1 | tr -d '\r')"
          version_code="$(git rev-list --count HEAD | tr -d '\n')"
          echo "tag_valid=${tag_valid}" >> "$GITHUB_OUTPUT"
          echo "tag_version_code=${tag_version_code}" >> "$GITHUB_OUTPUT"
          echo "configured_version_name=${configured_version_name}" >> "$GITHUB_OUTPUT"
          echo "version_name=${version_name}" >> "$GITHUB_OUTPUT"
          echo "version_code=${version_code}" >> "$GITHUB_OUTPUT"
          echo "xposed_tag=${RELEASE_TAG_RAW}" >> "$GITHUB_OUTPUT"

      - name: Check Status
        id: check
        shell: bash
        run: |
          # 简化版检查，如果是手动触发直接放行，如果是tag则校验
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            # 此处保持你原有的逻辑判断...
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: "oracle", java-version: "17.0.1", cache: "gradle" }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew assembleRelease

      - name: Stage APKs Separately
        shell: bash
        run: |
          mkdir -p "${STAGING_DIR}"
          find "${RELEASE_DIR}" -maxdepth 1 -type f -name "*.apk" -exec cp {} "${STAGING_DIR}/" \;

      - name: Upload Separate APK Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Sesame-AG-${{ github.ref_name }}-APKs
          path: ${{ env.STAGING_DIR }}/*.apk
          archive: false # 关键修复：禁止自动打包成zip，支持直接上传多个独立文件
          if-no-files-found: error
